<div style="margin-bottom: 20px;">
  <img src="{{ doc.image }}" alt="{{ doc.name }}" style="max-width: 150px; height: auto; display: block; margin-bottom: 10px;">
  <a href="/{{ doc.route }}" style="font-size: 18px; font-weight: bold;">{{ doc.name }}</a><br>
  <span>By {{ doc.author }}</span>
</div>
